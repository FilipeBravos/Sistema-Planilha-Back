spring.application.name=sistema-planilha-back

# Banco H2 em arquivo (persiste em ./data). Para PostgreSQL/MySQL basta trocar url/driver/dialeto.
spring.datasource.url=jdbc:h2:file:./data/planilha;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Origem(ns) permitida(s) para o front Angular
app.cors.allowed-origins=http://localhost:4200
