spring.application.name=sistema-planilha-back

# PostgreSQL (valores padrão para o docker-compose.yml; sobrescreva com variáveis de ambiente)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/planilha}
spring.datasource.username=${DB_USER:planilha}
spring.datasource.password=${DB_PASSWORD:planilha}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Origem(ns) permitida(s) para o front Angular
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Login: usuários criados na primeira execução (login:senha,login2:senha2; senha com 8+ caracteres).
# Não altera quem já existe; cada pessoa troca a própria senha pela tela.
app.usuarios-iniciais=${APP_USUARIOS_INICIAIS:}

# Sessão (cookie HttpOnly). Em produção com HTTPS defina COOKIE_SEGURO=true.
server.servlet.session.timeout=12h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${COOKIE_SEGURO:false}
# Atrás de proxy (Caddy/nginx): usa X-Forwarded-* para o IP e o protocolo reais.
server.forward-headers-strategy=framework
