spring.application.name=sistema-planilha-back

# PostgreSQL (valores padrão para o docker-compose.yml; sobrescreva com variáveis de ambiente)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/planilha}
spring.datasource.username=${DB_USER:planilha}
spring.datasource.password=${DB_PASSWORD:planilha}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Origem(ns) permitida(s) para o front Angular
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}
